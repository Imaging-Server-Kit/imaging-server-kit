[project]
name = "imaging-server-kit"
dynamic = ["version"]
description = "Convert image processing functions to GUIs, FastAPI servers, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mallory Wittwer", email = "mallory.wittwer@epfl.ch" }]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy",
    "tifffile",               # To encode/decode.
    "tqdm",                   # For progress bars.
    "pydantic>=2.0",          # For schema validation.
    "scikit-image[optional]", # To imread samples and run demo examples.
    "jinja2",                 # To template the info endpoint.
    "PyYAML",                 # To load the metadata yaml file.
    "imantics",               # To convert masks to features. Comes with opencv-python.
    "geojson",                # To convert masks and points to features.
    # FastAPI and related:
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "msgpack",
    "networkx",
    # Napari:
    "qtpy",
    "napari[all]>=0.4.16",
    "napari-toolkit",
]

[project.optional-dependencies]
qupath = ["qubalab>=0.2.0"]  # Restricts Python version to be 3.11 -> 3.13...
docs = ["jupyter-book<2.0", "jupytext"]
test = ["pytest", "coverage"]
all = ["imaging-server-kit[docs,test]"]

[project.scripts]
serverkit = "imaging_server_kit.cli:main"

[project.entry-points."napari.manifest"]
imaging_server_kit = "imaging_server_kit.gui.napari_serverkit:napari.yaml"

[project.urls]
repository = "https://github.com/Imaging-Server-Kit/imaging-server-kit"
documentation = "https://imaging-server-kit.github.io/imaging-server-kit"

[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
"imaging_server_kit.core" = [
    "templates/*.html",
    "static/css/*",
    "static/js/*",
    "static/*",
]

[tool.setuptools_scm]
write_to = "src/imaging_server_kit/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
