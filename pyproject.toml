[project]
name = "imaging-server-kit"
dynamic = ["version"]
description = "Convert image processing functions to GUIs, FastAPI servers, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mallory Wittwer", email = "mallory.wittwer@epfl.ch" }]

classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy",
    "pandas",
    "tifffile",               # To encode/decode.
    "rich",                   # For progress bars.
    "pydantic>=2.0",          # For schema validation.
    "scikit-image[optional]", # To imread samples and run demo examples.
    "jinja2",                 # To template the info endpoint.
    "PyYAML",                 # To load the metadata yaml file.
    "rasterio",               # To convert masks to features and back.
    "shapely>=2.0",           # To merge polygons of the same object.
    "geojson",                # To convert masks and points to features.
    # FastAPI and related:
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "msgpack",
    "networkx",
]

[project.optional-dependencies]
napari = ["qtpy", "napari[all]>=0.4.16", "napari-toolkit", "opencv-contrib-python-headless"]  # Use opencv-headless to avoid interferring with PyQt
qupath = ["imaging-server-kit[napari]", "qubalab>=0.2.0"]  # Restricts Python version to be 3.11 -> 3.13...
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]  # ruff formats signatures in the API reference
test = ["pytest", "coverage", "httpx2"]
all = ["imaging-server-kit[napari,qupath,docs,test]"]

[project.scripts]
serverkit = "imaging_server_kit.cli:main"

[project.entry-points."napari.manifest"]
imaging_server_kit = "imaging_server_kit.gui.napari_serverkit:napari.yaml"

[project.urls]
repository = "https://github.com/Imaging-Server-Kit/imaging-server-kit"
documentation = "https://imaging-server-kit.github.io/imaging-server-kit"

[build-system]
requires = ["setuptools>=42.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
"imaging_server_kit.core" = [
    "templates/*.html",
    "static/css/*",
    "static/js/*",
    "static/*",
]

[tool.setuptools_scm]
write_to = "src/imaging_server_kit/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore warnings related to pydantic (coming from napari)
    "ignore:.*json_encoders.*:DeprecationWarning",
]
